name: Bug report
description: Something doesn't work
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "Windows 11, macOS 15, Ubuntu 24.04"
    validations:
      required: true
  - type: input
    id: audio-device
    attributes:
      label: Audio device
      description: The output device you use, including the controller's built-in sound card if any.
  - type: input
    id: controller
    attributes:
      label: Controller
      placeholder: "Pioneer DDJ-SB3"
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Paste any relevant log output.
      render: text
