[licenses]
# MPL-2.0 is file-level copyleft (symphonia); it is compatible with distributing this
# project under Apache-2.0. GPL-family licenses are excluded by the spec.
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "MPL-2.0",
  "CC0-1.0",
]

[advisories]
# defaults: known vulnerabilities are denied

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
