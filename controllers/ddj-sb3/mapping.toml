# Default mapping for the Pioneer DDJ-SB3.
#
# Every MIDI value below comes from our own capture, controllers/ddj-sb3/capture.toml.
# Behavior follows VirtualDJ's default SB3 layout, limited to the actions that exist.
# Channels are 1-based: status 0x90/0xB0 is channel 1, 0x91/0xB1 channel 2, 0x96/0xB6
# channel 7. Each binding is checked by crates/controller/tests/sb3_replay.rs.
#
# Layering decision: SOFTWARE layering.
# Evidence: in the capture, every deck-3 control sends byte-identical messages to deck 1
# and every deck-4 control to deck 2 (mixer channel 3 == channel 1, channel 4 ==
# channel 2). The DECK buttons send left 0x90 0x72 / right 0x91 0x72 and have no
# hardware light. So deck and mixer bindings use `side = "left"` / `side = "right"` and
# follow the side's active deck: each DECK press toggles the side (decks 1/3 on the
# left, 2/4 on the right), starting on decks 1 and 2.
#
# SHIFT: the SB3 sends different notes for shifted buttons (CUE 0x0C, SHIFT+CUE 0x48),
# so shifted functions bind to the shifted note and need no `shift` condition. When SHIFT
# goes down while a button is held, its note-off arrives on the shifted note: the shifted
# CUE and pad actions (return to start, hotcue delete) end the hold on release.

[controller]
name = "Pioneer DDJ-SB3"
port = "DDJ-SB3"
# One full turn of a jog wheel (top or outer ring) sends this many relative steps. A first
# estimate, to be tuned in the hands-on check; the jog bindings below require the key.
jog_steps_per_turn = 720

# The SB3 applies its MASTER and HEADPHONES knobs in its own audio interface, so the
# software levels stay at full. Both knobs do send MIDI (MASTER cc14 ch7 0x08/0x28,
# HEADPHONES cc14 ch7 0x0D/0x2D) and are deliberately left unbound.
[[init]]
action = "master.level"
value = 1.0

[[init]]
action = "master.headphone_level"
value = 1.0

# Soft takeover starts disarmed when the controller first attaches (nothing is known
# about where the faders are), so a channel would sound at whatever level its fader
# happens to sit on at startup. Closing every channel fader here keeps the decks silent
# until their fader is touched; the first touch then takes the fader's position.

[[init]]
action = "channel.fader"
deck = 1
value = 0.0

[[init]]
action = "channel.fader"
deck = 2
value = 0.0

[[init]]
action = "channel.fader"
deck = 3
value = 0.0

[[init]]
action = "channel.fader"
deck = 4
value = 0.0

# ---------------------------------------------------------------- left deck (1 / 3)

[[input]]
midi = { channel = 1, note = 0x3F }
action = "modifier.shift"
side = "left"

[[input]]
midi = { channel = 1, note = 0x72 }
action = "side.deck_toggle"
side = "left"

[[input]]
midi = { channel = 1, note = 0x0B }
action = "deck.play_pause"
side = "left"

[[input]]
midi = { channel = 1, note = 0x0C }
action = "deck.cue"
side = "left"

# SHIFT + CUE
[[input]]
midi = { channel = 1, note = 0x48 }
action = "deck.return_to_start"
side = "left"

# SHIFT + KEY LOCK
[[input]]
midi = { channel = 1, note = 0x60 }
action = "deck.tempo_range_next"
side = "left"

# TEMPO: the capture reached 0 with the slider pulled fully toward the player, which is
# the "+" (faster) end, so the value is inverted. Confirmed on the owner's SB3 in the
# hands-on check: toward you is faster.
[[input]]
midi = { channel = 1, cc14 = [0x00, 0x20] }
action = "deck.tempo"
side = "left"
invert = true

# --------------------------------------------------------------- right deck (2 / 4)

[[input]]
midi = { channel = 2, note = 0x3F }
action = "modifier.shift"
side = "right"

[[input]]
midi = { channel = 2, note = 0x72 }
action = "side.deck_toggle"
side = "right"

[[input]]
midi = { channel = 2, note = 0x0B }
action = "deck.play_pause"
side = "right"

[[input]]
midi = { channel = 2, note = 0x0C }
action = "deck.cue"
side = "right"

# SHIFT + CUE
[[input]]
midi = { channel = 2, note = 0x48 }
action = "deck.return_to_start"
side = "right"

# SHIFT + KEY LOCK
[[input]]
midi = { channel = 2, note = 0x60 }
action = "deck.tempo_range_next"
side = "right"

# TEMPO: inverted, as on the left deck.
[[input]]
midi = { channel = 2, cc14 = [0x00, 0x20] }
action = "deck.tempo"
side = "right"
invert = true

# ------------------------------------------------------- mixer, left channel (1 / 3)

[[input]]
midi = { channel = 1, cc14 = [0x04, 0x24] }
action = "channel.trim"
side = "left"

[[input]]
midi = { channel = 1, cc14 = [0x07, 0x27] }
action = "channel.eq_high"
side = "left"

[[input]]
midi = { channel = 1, cc14 = [0x0B, 0x2B] }
action = "channel.eq_mid"
side = "left"

[[input]]
midi = { channel = 1, cc14 = [0x0F, 0x2F] }
action = "channel.eq_low"
side = "left"

[[input]]
midi = { channel = 7, cc14 = [0x17, 0x37] }
action = "channel.filter"
side = "left"

[[input]]
midi = { channel = 1, cc14 = [0x13, 0x33] }
action = "channel.fader"
side = "left"

# Headphone CUE
[[input]]
midi = { channel = 1, note = 0x54 }
action = "channel.pfl_toggle"
side = "left"

# ------------------------------------------------------ mixer, right channel (2 / 4)

[[input]]
midi = { channel = 2, cc14 = [0x04, 0x24] }
action = "channel.trim"
side = "right"

[[input]]
midi = { channel = 2, cc14 = [0x07, 0x27] }
action = "channel.eq_high"
side = "right"

[[input]]
midi = { channel = 2, cc14 = [0x0B, 0x2B] }
action = "channel.eq_mid"
side = "right"

[[input]]
midi = { channel = 2, cc14 = [0x0F, 0x2F] }
action = "channel.eq_low"
side = "right"

[[input]]
midi = { channel = 7, cc14 = [0x18, 0x38] }
action = "channel.filter"
side = "right"

[[input]]
midi = { channel = 2, cc14 = [0x13, 0x33] }
action = "channel.fader"
side = "right"

# Headphone CUE
[[input]]
midi = { channel = 2, note = 0x54 }
action = "channel.pfl_toggle"
side = "right"

# ------------------------------------------------------------------- mixer, global

[[input]]
midi = { channel = 7, cc14 = [0x1F, 0x3F] }
action = "master.crossfader"

# Headphone MASTER button
[[input]]
midi = { channel = 7, note = 0x5B }
action = "master.headphone_master_toggle"

# --------------------------------------------------------------------------- browser

# BROWSE rotate: the capture sent 1 per click clockwise and 127 counter-clockwise, so
# two's complement steps, with clockwise moving down the list.
[[input]]
midi = { channel = 7, cc = 0x40 }
action = "browser.scroll"
value = "relative_twos"

# BROWSE press switches between the tree and the track list.
[[input]]
midi = { channel = 7, note = 0x41 }
action = "browser.toggle_focus"

# LOAD loads the selected track onto the deck the side shows (1/3 left, 2/4 right).
[[input]]
midi = { channel = 7, note = 0x46 }
action = "deck.load_selected"
side = "left"

[[input]]
midi = { channel = 7, note = 0x47 }
action = "deck.load_selected"
side = "right"

# ------------------------------------------------------------ performance, left side

# SYNC
[[input]]
midi = { channel = 1, note = 0x58 }
action = "deck.sync"
side = "left"

# VINYL
[[input]]
midi = { channel = 1, note = 0x17 }
action = "deck.vinyl_toggle"
side = "left"

# AUTO LOOP
[[input]]
midi = { channel = 1, note = 0x14 }
action = "deck.auto_loop"
side = "left"

# 1/2X
[[input]]
midi = { channel = 1, note = 0x12 }
action = "deck.loop_halve"
side = "left"

# 2X
[[input]]
midi = { channel = 1, note = 0x13 }
action = "deck.loop_double"
side = "left"

# SHIFT + 1/2X: loop in (per Pioneer's manual; the owner confirms the panel label)
[[input]]
midi = { channel = 1, note = 0x61 }
action = "deck.loop_in"
side = "left"

# SHIFT + 2X: loop out (per Pioneer's manual)
[[input]]
midi = { channel = 1, note = 0x62 }
action = "deck.loop_out"
side = "left"

# SHIFT + AUTO LOOP: reloop / exit (per Pioneer's manual)
[[input]]
midi = { channel = 1, note = 0x50 }
action = "deck.reloop_exit"
side = "left"

# Jog top touched or released
[[input]]
midi = { channel = 1, note = 0x36 }
action = "deck.jog_touch"
side = "left"

# SHIFT + jog touch: only lets go, so a touch begun with SHIFT held (a search) never
# holds the record, and a touch begun without SHIFT still ends when SHIFT goes down first
[[input]]
midi = { channel = 1, note = 0x67 }
action = "deck.jog_release"
side = "left"

# Jog top
[[input]]
midi = { channel = 1, cc = 0x23 }
action = "deck.jog_top"
side = "left"
value = "relative_offset"

# Jog outer ring
[[input]]
midi = { channel = 1, cc = 0x21 }
action = "deck.jog_ring"
side = "left"
value = "relative_offset"

# SHIFT + jog top: fast search
[[input]]
midi = { channel = 1, cc = 0x1F }
action = "deck.jog_search"
side = "left"
value = "relative_offset"

# Firmware routines. In FX FADE and PAD SCRATCH the SB3 runs its own routines on the pads
# and sends, besides the pad notes, messages of its own (VirtualDJ's names below). The
# routines also move the fader and FILTER (bound above) and end by sending their physical
# positions, so the deck ends where the controls are. Recorded in firmware-modes.txt and
# firmware-modes-2.txt on the left side; the right side is bound the same.
# LOOP_FADE_LOOP (note 0x4D) stays unbound: the SB3 also sends it when TRANS is selected
# and during the backspin, so it would start loops nobody asked for.

# JOG_VINYL: the routines' scratch, whatever VINYL says (PAD SCRATCH, the backspin nudge)
[[input]]
midi = { channel = 1, cc = 0x22 }
action = "deck.jog_scratch"
side = "left"
value = "relative_offset"

# LOOP_FADE_SEL_1: sent after FX FADE pad 3's first press
[[input]]
midi = { channel = 1, note = 0x4C }
action = "deck.loop_fade_1"
side = "left"

# LOOP_FADE_SEL_4: sent after FX FADE pad 7's first press; the SB3 then shrinks the loop
# with its own 1/2X presses (note 0x12, bound above)
[[input]]
midi = { channel = 1, note = 0x4A }
action = "deck.loop_fade_4"
side = "left"

# FX FADE pads 3 and 7: each press first exits a loop, so the second press ends the
# routine's loop (on the deck it started on, even after DECK) and the first press, which
# the SB3 follows with its LOOP_FADE_SEL note, replaces any loop the DJ had on
[[input]]
midi = { channel = 8, note = 0x12 }
action = "deck.loop_exit"
side = "left"
pad_mode = "hardware"

[[input]]
midi = { channel = 8, note = 0x16 }
action = "deck.loop_exit"
side = "left"
pad_mode = "hardware"

# FX FADE pad 4: short backspin; pad 8: long backspin (lengths in config.toml)
[[input]]
midi = { channel = 8, note = 0x13 }
action = "deck.backspin_short"
side = "left"
pad_mode = "hardware"

[[input]]
midi = { channel = 8, note = 0x17 }
action = "deck.backspin_long"
side = "left"
pad_mode = "hardware"

# Pad modes. The SB3 has hardware pad modes (HOT CUE, FX FADE, PAD SCRATCH, SAMPLER) that
# decide which notes the pads send; software pad modes decide what the app does with them.
# Each side has its own software mode, set by the buttons below, and the pad bindings
# carry `pad_mode` so only the side's current mode applies:
#   hardware   the notes the hardware mode sends: HOT CUE pads set/jump/delete hotcues,
#              SAMPLER pads play and stop samples (config.toml holds the files)
#   beat_jump  SHIFT + HOT CUE; the SB3 does not switch its pads, so they keep sending
#              the notes of the last hardware mode, and the software modes bind both the
#              HOT CUE bank (0x00-0x0F) and the SAMPLER bank (0x30-0x3F)
#   loop_roll  SHIFT + FX FADE; the pads are held, and bound on the shifted notes too so
#              a release after SHIFT went down still ends the roll
#   slicer     SHIFT + PAD SCRATCH; held pads, as for loop_roll
# Press HOT CUE or SAMPLER before choosing a software mode: while the SB3 is in FX FADE or
# PAD SCRATCH it runs its own routine on the pads and sends other notes. HOT CUE, FX FADE,
# PAD SCRATCH, SAMPLER and SHIFT + SAMPLER (TRANS) all go back to the hardware mode. The
# SB3 does not light the mode buttons for this, so the status line shows the mode.
# Capture note: the left SHIFT + SAMPLER pads were captured on 0x30-0x37 (the unshifted
# notes); the right side sent 0x38-0x3F, and the left side is bound the same.

# HOT CUE
[[input]]
midi = { channel = 1, note = 0x1B }
action = "pads.mode_hardware"
side = "left"

# FX FADE
[[input]]
midi = { channel = 1, note = 0x1E }
action = "pads.mode_hardware"
side = "left"

# PAD SCRATCH
[[input]]
midi = { channel = 1, note = 0x20 }
action = "pads.mode_hardware"
side = "left"

# SAMPLER
[[input]]
midi = { channel = 1, note = 0x22 }
action = "pads.mode_hardware"
side = "left"

# SHIFT + SAMPLER (TRANS)
[[input]]
midi = { channel = 1, note = 0x6E }
action = "pads.mode_hardware"
side = "left"

# SHIFT + HOT CUE
[[input]]
midi = { channel = 1, note = 0x69 }
action = "pads.mode_beat_jump"
side = "left"

# SHIFT + FX FADE
[[input]]
midi = { channel = 1, note = 0x6B }
action = "pads.mode_loop_roll"
side = "left"

# SHIFT + PAD SCRATCH
[[input]]
midi = { channel = 1, note = 0x6D }
action = "pads.mode_slicer"
side = "left"

# SHIFT + VINYL
[[input]]
midi = { channel = 1, note = 0x40 }
action = "deck.slip_toggle"
side = "left"

# KEY LOCK (SHIFT + KEY LOCK, note 0x60, is the tempo range above)
[[input]]
midi = { channel = 1, note = 0x1A }
action = "deck.keylock_toggle"
side = "left"

# FX 1, 2 and 3 switch the effect slots of the side's deck on and off. SHIFT + FX
# (notes 0x63-0x65) stay unbound: effect parameters are not mapped.
[[input]]
midi = { channel = 5, notes = [0x47, 0x49] }
action = "deck.fx_toggle_{n}"
side = "left"

# FX LEVEL: the knob also sends 0x04/0x24 and 0x06/0x26 with the same value; only the
# first pair is bound.
[[input]]
midi = { channel = 5, cc14 = [0x02, 0x22] }
action = "deck.fx_level"
side = "left"

# Pads: one `notes` range binds a whole bank, and `{n}` in the action is the pad number
# (1-8) counted from the range start. Every software mode binds the HOT CUE bank
# (0x00-0x07), its SHIFT bank (0x08-0x0F), the SAMPLER bank (0x30-0x37) and its SHIFT
# bank (0x38-0x3F).

# Hardware mode: HOT CUE pads set or jump to hotcues, SHIFT + HOT CUE pads delete them
[[input]]
midi = { channel = 8, notes = [0x00, 0x07] }
action = "deck.hotcue_{n}"
side = "left"
pad_mode = "hardware"

[[input]]
midi = { channel = 8, notes = [0x08, 0x0F] }
action = "deck.hotcue_delete_{n}"
side = "left"
pad_mode = "hardware"

# Hardware mode: SAMPLER pads play samples and SHIFT + SAMPLER pads stop them (the
# sampler is shared, so both sides play the same samples)
[[input]]
midi = { channel = 8, notes = [0x30, 0x37] }
action = "sampler.play_{n}"
side = "left"
pad_mode = "hardware"

[[input]]
midi = { channel = 8, notes = [0x38, 0x3F] }
action = "sampler.stop_{n}"
side = "left"
pad_mode = "hardware"

# Software mode beat jump, on the HOT CUE bank then the SAMPLER bank
[[input]]
midi = { channel = 8, notes = [0x00, 0x07] }
action = "deck.beat_jump_{n}"
side = "left"
pad_mode = "beat_jump"

[[input]]
midi = { channel = 8, notes = [0x30, 0x37] }
action = "deck.beat_jump_{n}"
side = "left"
pad_mode = "beat_jump"

# Beat jump with SHIFT
[[input]]
midi = { channel = 8, notes = [0x08, 0x0F] }
action = "deck.beat_jump_shift_{n}"
side = "left"
pad_mode = "beat_jump"

[[input]]
midi = { channel = 8, notes = [0x38, 0x3F] }
action = "deck.beat_jump_shift_{n}"
side = "left"
pad_mode = "beat_jump"

# Software mode loop roll: the SHIFT banks bind the same action, so a release after
# SHIFT went down mid-press still ends the roll
[[input]]
midi = { channel = 8, notes = [0x00, 0x07] }
action = "deck.loop_roll_{n}"
side = "left"
pad_mode = "loop_roll"

[[input]]
midi = { channel = 8, notes = [0x30, 0x37] }
action = "deck.loop_roll_{n}"
side = "left"
pad_mode = "loop_roll"

[[input]]
midi = { channel = 8, notes = [0x08, 0x0F] }
action = "deck.loop_roll_{n}"
side = "left"
pad_mode = "loop_roll"

[[input]]
midi = { channel = 8, notes = [0x38, 0x3F] }
action = "deck.loop_roll_{n}"
side = "left"
pad_mode = "loop_roll"

# Software mode slicer: as for loop roll, the SHIFT banks end the slice
[[input]]
midi = { channel = 8, notes = [0x00, 0x07] }
action = "deck.slice_{n}"
side = "left"
pad_mode = "slicer"

[[input]]
midi = { channel = 8, notes = [0x30, 0x37] }
action = "deck.slice_{n}"
side = "left"
pad_mode = "slicer"

[[input]]
midi = { channel = 8, notes = [0x08, 0x0F] }
action = "deck.slice_{n}"
side = "left"
pad_mode = "slicer"

[[input]]
midi = { channel = 8, notes = [0x38, 0x3F] }
action = "deck.slice_{n}"
side = "left"
pad_mode = "slicer"

# ------------------------------------------------------------ performance, right side

# SYNC
[[input]]
midi = { channel = 2, note = 0x58 }
action = "deck.sync"
side = "right"

# VINYL
[[input]]
midi = { channel = 2, note = 0x17 }
action = "deck.vinyl_toggle"
side = "right"

# AUTO LOOP
[[input]]
midi = { channel = 2, note = 0x14 }
action = "deck.auto_loop"
side = "right"

# 1/2X
[[input]]
midi = { channel = 2, note = 0x12 }
action = "deck.loop_halve"
side = "right"

# 2X
[[input]]
midi = { channel = 2, note = 0x13 }
action = "deck.loop_double"
side = "right"

# SHIFT + 1/2X: loop in (per Pioneer's manual; the owner confirms the panel label)
[[input]]
midi = { channel = 2, note = 0x61 }
action = "deck.loop_in"
side = "right"

# SHIFT + 2X: loop out (per Pioneer's manual)
[[input]]
midi = { channel = 2, note = 0x62 }
action = "deck.loop_out"
side = "right"

# SHIFT + AUTO LOOP: reloop / exit (per Pioneer's manual)
[[input]]
midi = { channel = 2, note = 0x50 }
action = "deck.reloop_exit"
side = "right"

# Jog top touched or released
[[input]]
midi = { channel = 2, note = 0x36 }
action = "deck.jog_touch"
side = "right"

# SHIFT + jog touch: only lets go, so a touch begun with SHIFT held (a search) never
# holds the record, and a touch begun without SHIFT still ends when SHIFT goes down first
[[input]]
midi = { channel = 2, note = 0x67 }
action = "deck.jog_release"
side = "right"

# Jog top
[[input]]
midi = { channel = 2, cc = 0x23 }
action = "deck.jog_top"
side = "right"
value = "relative_offset"

# Jog outer ring
[[input]]
midi = { channel = 2, cc = 0x21 }
action = "deck.jog_ring"
side = "right"
value = "relative_offset"

# SHIFT + jog top: fast search
[[input]]
midi = { channel = 2, cc = 0x1F }
action = "deck.jog_search"
side = "right"
value = "relative_offset"

# Firmware routines. In FX FADE and PAD SCRATCH the SB3 runs its own routines on the pads
# and sends, besides the pad notes, messages of its own (VirtualDJ's names below). The
# routines also move the fader and FILTER (bound above) and end by sending their physical
# positions, so the deck ends where the controls are. Recorded in firmware-modes.txt and
# firmware-modes-2.txt on the left side; the right side is bound by symmetry (channel 2, pads on channel 9), as the capture shows the same messages there.
# LOOP_FADE_LOOP (note 0x4D) stays unbound: the SB3 also sends it when TRANS is selected
# and during the backspin, so it would start loops nobody asked for.

# JOG_VINYL: the routines' scratch, whatever VINYL says (PAD SCRATCH, the backspin nudge)
[[input]]
midi = { channel = 2, cc = 0x22 }
action = "deck.jog_scratch"
side = "right"
value = "relative_offset"

# LOOP_FADE_SEL_1: sent after FX FADE pad 3's first press
[[input]]
midi = { channel = 2, note = 0x4C }
action = "deck.loop_fade_1"
side = "right"

# LOOP_FADE_SEL_4: sent after FX FADE pad 7's first press; the SB3 then shrinks the loop
# with its own 1/2X presses (note 0x12, bound above)
[[input]]
midi = { channel = 2, note = 0x4A }
action = "deck.loop_fade_4"
side = "right"

# FX FADE pads 3 and 7: each press first exits a loop, so the second press ends the
# routine's loop (on the deck it started on, even after DECK) and the first press, which
# the SB3 follows with its LOOP_FADE_SEL note, replaces any loop the DJ had on
[[input]]
midi = { channel = 9, note = 0x12 }
action = "deck.loop_exit"
side = "right"
pad_mode = "hardware"

[[input]]
midi = { channel = 9, note = 0x16 }
action = "deck.loop_exit"
side = "right"
pad_mode = "hardware"

# FX FADE pad 4: short backspin; pad 8: long backspin (lengths in config.toml)
[[input]]
midi = { channel = 9, note = 0x13 }
action = "deck.backspin_short"
side = "right"
pad_mode = "hardware"

[[input]]
midi = { channel = 9, note = 0x17 }
action = "deck.backspin_long"
side = "right"
pad_mode = "hardware"

# Pad mode buttons. HOT CUE, FX FADE, PAD SCRATCH and SAMPLER (and SHIFT + SAMPLER,
# TRANS) leave the pads to the controller's own modes; the SHIFT variants of the other
# three pick a software pad mode.

# HOT CUE
[[input]]
midi = { channel = 2, note = 0x1B }
action = "pads.mode_hardware"
side = "right"

# FX FADE
[[input]]
midi = { channel = 2, note = 0x1E }
action = "pads.mode_hardware"
side = "right"

# PAD SCRATCH
[[input]]
midi = { channel = 2, note = 0x20 }
action = "pads.mode_hardware"
side = "right"

# SAMPLER
[[input]]
midi = { channel = 2, note = 0x22 }
action = "pads.mode_hardware"
side = "right"

# SHIFT + SAMPLER (TRANS)
[[input]]
midi = { channel = 2, note = 0x6E }
action = "pads.mode_hardware"
side = "right"

# SHIFT + HOT CUE
[[input]]
midi = { channel = 2, note = 0x69 }
action = "pads.mode_beat_jump"
side = "right"

# SHIFT + FX FADE
[[input]]
midi = { channel = 2, note = 0x6B }
action = "pads.mode_loop_roll"
side = "right"

# SHIFT + PAD SCRATCH
[[input]]
midi = { channel = 2, note = 0x6D }
action = "pads.mode_slicer"
side = "right"

# SHIFT + VINYL
[[input]]
midi = { channel = 2, note = 0x40 }
action = "deck.slip_toggle"
side = "right"

# KEY LOCK (SHIFT + KEY LOCK, note 0x60, is the tempo range above)
[[input]]
midi = { channel = 2, note = 0x1A }
action = "deck.keylock_toggle"
side = "right"

# FX 1, 2 and 3 switch the effect slots of the side's deck on and off. SHIFT + FX
# (notes 0x63-0x65) stay unbound: effect parameters are not mapped.
[[input]]
midi = { channel = 6, notes = [0x47, 0x49] }
action = "deck.fx_toggle_{n}"
side = "right"

# FX LEVEL: the knob also sends 0x04/0x24 and 0x06/0x26 with the same value; only the
# first pair is bound.
[[input]]
midi = { channel = 6, cc14 = [0x02, 0x22] }
action = "deck.fx_level"
side = "right"

# Hardware mode: HOT CUE pads set or jump to hotcues, SHIFT + HOT CUE pads delete them
[[input]]
midi = { channel = 9, notes = [0x00, 0x07] }
action = "deck.hotcue_{n}"
side = "right"
pad_mode = "hardware"

[[input]]
midi = { channel = 9, notes = [0x08, 0x0F] }
action = "deck.hotcue_delete_{n}"
side = "right"
pad_mode = "hardware"

# Hardware mode: SAMPLER pads play samples and SHIFT + SAMPLER pads stop them (the
# sampler is shared, so both sides play the same samples)
[[input]]
midi = { channel = 9, notes = [0x30, 0x37] }
action = "sampler.play_{n}"
side = "right"
pad_mode = "hardware"

[[input]]
midi = { channel = 9, notes = [0x38, 0x3F] }
action = "sampler.stop_{n}"
side = "right"
pad_mode = "hardware"

# Software mode beat jump, on the HOT CUE bank then the SAMPLER bank
[[input]]
midi = { channel = 9, notes = [0x00, 0x07] }
action = "deck.beat_jump_{n}"
side = "right"
pad_mode = "beat_jump"

[[input]]
midi = { channel = 9, notes = [0x30, 0x37] }
action = "deck.beat_jump_{n}"
side = "right"
pad_mode = "beat_jump"

# Beat jump with SHIFT
[[input]]
midi = { channel = 9, notes = [0x08, 0x0F] }
action = "deck.beat_jump_shift_{n}"
side = "right"
pad_mode = "beat_jump"

[[input]]
midi = { channel = 9, notes = [0x38, 0x3F] }
action = "deck.beat_jump_shift_{n}"
side = "right"
pad_mode = "beat_jump"

# Software mode loop roll: the SHIFT banks bind the same action, so a release after
# SHIFT went down mid-press still ends the roll
[[input]]
midi = { channel = 9, notes = [0x00, 0x07] }
action = "deck.loop_roll_{n}"
side = "right"
pad_mode = "loop_roll"

[[input]]
midi = { channel = 9, notes = [0x30, 0x37] }
action = "deck.loop_roll_{n}"
side = "right"
pad_mode = "loop_roll"

[[input]]
midi = { channel = 9, notes = [0x08, 0x0F] }
action = "deck.loop_roll_{n}"
side = "right"
pad_mode = "loop_roll"

[[input]]
midi = { channel = 9, notes = [0x38, 0x3F] }
action = "deck.loop_roll_{n}"
side = "right"
pad_mode = "loop_roll"

# Software mode slicer: as for loop roll, the SHIFT banks end the slice
[[input]]
midi = { channel = 9, notes = [0x00, 0x07] }
action = "deck.slice_{n}"
side = "right"
pad_mode = "slicer"

[[input]]
midi = { channel = 9, notes = [0x30, 0x37] }
action = "deck.slice_{n}"
side = "right"
pad_mode = "slicer"

[[input]]
midi = { channel = 9, notes = [0x08, 0x0F] }
action = "deck.slice_{n}"
side = "right"
pad_mode = "slicer"

[[input]]
midi = { channel = 9, notes = [0x38, 0x3F] }
action = "deck.slice_{n}"
side = "right"
pad_mode = "slicer"

# ------------------------------------------------------------------------ LEDs
#
# Only the headphone MASTER LED responds. A full LED scan (all 16 channels, note-on,
# with and without audio streaming to the SB3) found no message lighting PLAY or CUE;
# SHIFT and DECK have no lights; the headphone CUE LED did not respond in the capture.

[[output]]
state = "master.headphone_master"
midi = { channel = 7, note = 0x5B }
on = 127
off = 0

# ----------------------------------------------------------------------------------
# Not mapped yet: the captured controls without a binding, with their MIDI messages.
# Left deck shown (channel 1, status 0x90/0xB0); the right deck sends the same on
# channel 2 (0x91/0xB1). Decks 3/4 send the same bytes as decks 1/2.
#
#   SHIFT+SYNC             note 0x5C
#   SHIFT+PLAY             note 0x47
#   channel fader + SHIFT  (fader start) notes 0x52 / 0x66, with the fader's cc14
#
#   Pads: channel 8 (0x97) left, channel 9 (0x98) right. HOT CUE (0x00-0x07, SHIFT
#     0x08-0x0F), SAMPLER (0x30-0x37, SHIFT 0x38-0x3F) and FX FADE pads 3/4/7/8 are
#     mapped; the others run firmware routines through bound messages and stay unbound:
#     FX FADE 0x10/0x11/0x14/0x15, PAD SCRATCH 0x20-0x27, TRANS from 0x70 (pad 1).
#     Firmware message LOOP_FADE_LOOP note 0x4D (see the firmware routines above).
#
#   SHIFT + FX buttons 1/2/3: channel 5 (0x94) left, channel 6 (0x95) right, notes
#     0x63/0x64/0x65 (FX 1/2/3 and the FX LEVEL cc14 0x02/0x22 are mapped; the knob's
#     0x04/0x24 and 0x06/0x26 repeat its value and are left unbound)
#
#   Global, channel 7 (0x96/0xB6):
#     MASTER level         cc14 0x08/0x28   (applied by the SB3 itself, see [[init]])
#     HEADPHONES level     cc14 0x0D/0x2D   (applied by the SB3 itself, see [[init]])
#     SHIFT+BROWSE rotate  cc 0x64
#     SHIFT+BROWSE press   note 0x42
#     SHIFT+LOAD left      note 0x58
#     SHIFT+LOAD right     note 0x59
