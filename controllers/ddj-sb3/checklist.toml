# Capture checklist for the Pioneer DDJ-SB3, used by `dj-software midi capture`.
#
# The control list follows the hardware description in the Mixxx manual
# (https://manual.mixxx.org/2.6/en/hardware/controllers/pioneer_ddj_sb3).
# Only the list of physical controls is taken from there; no MIDI values. Those
# come from the capture itself.
#
# Each section may repeat once per deck (`decks`), with {deck} substituted in
# its name, setup, ids and prompts. A step with `shift = true` is also captured
# with SHIFT held, as a separate step whose id ends in ".shift"; `held_shift`
# marks a step that is itself done with SHIFT held. `prepare` is done before
# listening starts, so that action is not recorded. A section's `shift_control`
# (an id or a list, one per layer) names the earlier SHIFT button steps whose
# notes are ignored in its SHIFT steps.

controller = "Pioneer DDJ-SB3"

# Sources that are never recorded.
# Observed parasitic burst on the owner's SB3, 2026-10-30: B5 02 32, B5 22 1A,
# B5 04 32, B5 24 1A, B5 06 32, B5 26 1A, sent now and then after other events.
[ignore]
sources = [
  { status = 0xB5, data1 = 0x02 },
  { status = 0xB5, data1 = 0x22 },
  { status = 0xB5, data1 = 0x04 },
  { status = 0xB5, data1 = 0x24 },
  { status = 0xB5, data1 = 0x06 },
  { status = 0xB5, data1 = 0x26 },
]

[[section]]
name = "Left deck {deck}"
decks = [1, 3]
setup = "Use the LEFT side. Make sure it controls deck {deck} (its DECK button switches between its two decks). For SHIFT steps, hold the LEFT SHIFT."
shift_control = "deck{deck}.shift"

[[section.step]]
id = "deck{deck}.shift"
prompt = "Press and release LEFT SHIFT."
kind = "button"

[[section.step]]
id = "deck{deck}.play"
prompt = "Press and release LEFT PLAY/PAUSE."
kind = "button"
shift = true

[[section.step]]
id = "deck{deck}.cue"
prompt = "Press and release LEFT CUE."
kind = "button"
shift = true

[[section.step]]
id = "deck{deck}.sync"
prompt = "Press and release LEFT SYNC."
kind = "button"
shift = true

[[section.step]]
id = "deck{deck}.key_lock"
