[[section.step]]
id = "deck{deck}.loop_double"
prompt = "Press and release LEFT 2X."
kind = "button"
shift = true

[[section.step]]
id = "deck{deck}.jog_touch"
prompt = "Touch the top plate of the LEFT jog wheel without turning it, then let go."
kind = "button"

[[section.step]]
id = "deck{deck}.jog_top"
prompt = "Keep a hand on the top plate of the LEFT jog wheel: turn it about one turn clockwise, then one turn counter-clockwise."
kind = "jog"
shift = true

[[section.step]]
id = "deck{deck}.jog_outer"
prompt = "Turn the outer ring of the LEFT jog wheel (do not touch the top plate) about one turn clockwise, then one turn counter-clockwise."
kind = "jog"

[[section.step]]
id = "deck{deck}.tempo"
prepare = "Move the LEFT TEMPO slider fully AWAY from you."
prompt = "Now pull the LEFT TEMPO slider fully toward you, then push it back to the middle."
kind = "continuous"

[[section.step]]
id = "deck{deck}.mode_hot_cue"
prompt = "Press and release LEFT HOT CUE (pad mode button)."
kind = "button"
shift = true

[[section.step]]
id = "deck{deck}.mode_fx_fade"
prompt = "Press and release LEFT FX FADE (pad mode button)."
kind = "button"
shift = true

[[section.step]]
id = "deck{deck}.mode_pad_scratch"
