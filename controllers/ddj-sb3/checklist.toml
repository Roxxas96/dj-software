prompt = "Tap the 8 LEFT pads one by one, 1 to 8."
kind = "pads"

[[section.step]]
id = "deck{deck}.pads_hot_cue.shift"
prompt = "Still in HOT CUE mode: hold LEFT SHIFT and keep holding it, then tap the 8 LEFT pads one by one, 1 to 8."
