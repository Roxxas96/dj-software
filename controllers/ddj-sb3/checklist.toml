[[section.step]]
id = "deck{deck}.pads_fx_fade"
prompt = "Before Enter: press RIGHT FX FADE (without SHIFT). After Enter: tap the 8 RIGHT pads one by one, 1 to 8."
kind = "pads"

[[section.step]]
id = "deck{deck}.pads_pad_scratch"
prompt = "Before Enter: press RIGHT PAD SCRATCH (without SHIFT). After Enter: tap the 8 RIGHT pads one by one, 1 to 8."
kind = "pads"

[[section.step]]
id = "deck{deck}.pads_sampler"
prompt = "Before Enter: press RIGHT SAMPLER (without SHIFT). After Enter: tap the 8 RIGHT pads one by one, 1 to 8."
kind = "pads"

[[section]]
name = "Mixer channel {deck}"
decks = [1, 2, 3, 4]
setup = "Mixer channel {deck}: decks 1 and 3 use the LEFT channel strip, decks 2 and 4 the RIGHT one. Press that side's DECK button until it controls deck {deck}. For SHIFT steps, hold that side's SHIFT."

[[section.step]]
id = "channel{deck}.trim"
prompt = "Turn the channel {deck} TRIM knob fully left, then fully right."
kind = "continuous"

[[section.step]]
id = "channel{deck}.eq_high"
prompt = "Turn the channel {deck} HI knob fully left, then fully right."
kind = "continuous"

[[section.step]]
id = "channel{deck}.eq_mid"
prompt = "Turn the channel {deck} MID knob fully left, then fully right."
kind = "continuous"

[[section.step]]
id = "channel{deck}.eq_low"
prompt = "Turn the channel {deck} LOW knob fully left, then fully right."
kind = "continuous"

[[section.step]]
id = "channel{deck}.filter"
prompt = "Turn the channel {deck} FILTER knob fully left, then fully right, then back to the middle."
kind = "continuous"

[[section.step]]
id = "channel{deck}.fader"
prompt = "Move the channel {deck} fader fully down, then fully up."
kind = "continuous"
shift = true

[[section.step]]
id = "channel{deck}.pfl"
prompt = "Press and release the channel {deck} headphone CUE button."
kind = "button"

[[section]]
name = "Global"
setup = "Controls shared by both sides. For SHIFT steps, hold the LEFT SHIFT."

[[section.step]]
id = "crossfader"
prompt = "Move the CROSSFADER fully left, then fully right."
kind = "continuous"

[[section.step]]
id = "master_level"
prompt = "Turn the MASTER level knob fully down, then back up. It may send nothing: skip (s) if nothing is echoed."
kind = "continuous"

[[section.step]]
id = "headphone_level"
prompt = "Turn the HEADPHONES level knob fully down, then back up. It may send nothing: skip (s) if nothing is echoed."
kind = "continuous"

[[section.step]]
id = "headphone_master"
prompt = "Press and release the headphone MASTER button."
kind = "button"

[[section.step]]
id = "fx.1"
prompt = "Press and release the FX 1 button (if each side has one, use the LEFT one)."
kind = "button"
shift = true

[[section.step]]
id = "fx.2"
prompt = "Press and release the FX 2 button (if each side has one, use the LEFT one)."
kind = "button"
shift = true

[[section.step]]
