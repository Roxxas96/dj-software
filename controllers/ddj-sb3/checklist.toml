prompt = "Press and release RIGHT PLAY/PAUSE."
kind = "button"
shift = true

[[section.step]]
id = "deck{deck}.cue"
prompt = "Press and release RIGHT CUE."
kind = "button"
shift = true

[[section.step]]
id = "deck{deck}.sync"
prompt = "Press and release RIGHT SYNC."
kind = "button"
shift = true

[[section.step]]
id = "deck{deck}.key_lock"
prompt = "Press and release RIGHT KEY LOCK."
kind = "button"
shift = true

[[section.step]]
id = "deck{deck}.vinyl"
prompt = "Press and release RIGHT VINYL."
kind = "button"
shift = true

[[section.step]]
id = "deck{deck}.auto_loop"
prompt = "Press and release RIGHT AUTO LOOP."
kind = "button"
shift = true

[[section.step]]
id = "deck{deck}.loop_half"
prompt = "Press and release RIGHT 1/2X."
kind = "button"
shift = true

[[section.step]]
id = "deck{deck}.loop_double"
prompt = "Press and release RIGHT 2X."
kind = "button"
shift = true

[[section.step]]
id = "deck{deck}.shift"
prompt = "Press and release RIGHT SHIFT."
kind = "button"

[[section.step]]
id = "deck{deck}.deck_select"
prompt = "Press RIGHT DECK twice (it should end on deck {deck} again)."
kind = "button"

[[section.step]]
id = "deck{deck}.jog_touch"
prompt = "Touch the top plate of the RIGHT jog wheel without turning it, then let go."
kind = "button"

[[section.step]]
id = "deck{deck}.jog_top"
prompt = "Keep a hand on the top plate of the RIGHT jog wheel: turn it about one turn clockwise, then one turn counter-clockwise."
kind = "jog"
shift = true

[[section.step]]
id = "deck{deck}.jog_outer"
prompt = "Turn the outer ring of the RIGHT jog wheel (do not touch the top plate) about one turn clockwise, then one turn counter-clockwise."
kind = "jog"

[[section.step]]
id = "deck{deck}.tempo"
prompt = "Move the RIGHT TEMPO slider fully toward you, then fully away from you, then back to the middle."
kind = "continuous"

[[section.step]]
id = "deck{deck}.mode_hot_cue"
prompt = "Press and release RIGHT HOT CUE (pad mode button)."
kind = "button"
shift = true

[[section.step]]
id = "deck{deck}.mode_fx_fade"
prompt = "Press and release RIGHT FX FADE (pad mode button)."
kind = "button"
shift = true

[[section.step]]
id = "deck{deck}.mode_pad_scratch"
prompt = "Press and release RIGHT PAD SCRATCH (pad mode button)."
kind = "button"
