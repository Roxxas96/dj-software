[package]
name = "stems"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[features]
default = ["model"]
# The real separator: htdemucs through ONNX Runtime (`ort`, whose build script downloads a
# prebuilt ONNX Runtime). Without it only the synthetic separator and `setup`'s download
# and fill are built.
model = ["dep:ort"]

[dependencies]
directories.workspace = true
engine = { path = "../engine" }
prost = "0.14.4"
realfft = "3.5.1"
rubato = "5.0.1"
safetensors = "0.8.0"
sha2 = "0.11.1"
tempfile.workspace = true
thiserror.workspace = true
ureq = { version = "3.5.1", default-features = false, features = ["native-tls-no-default"] }
ort = { version = "=2.0.0-rc.15", optional = true }

# The only prebuilt ONNX Runtime for macOS that `ort` downloads with CoreML is selected by
# the `coreml` feature; on Windows the prebuilts all carry an execution provider
# (`directml` or `openvino`), so without one no prebuilt matches.
[target.'cfg(target_os = "macos")'.dependencies]
ort = { version = "=2.0.0-rc.15", optional = true, features = ["coreml"] }

[target.'cfg(windows)'.dependencies]
ort = { version = "=2.0.0-rc.15", optional = true, features = ["directml"] }

[build-dependencies]
prost-build = "0.14.4"
protox = "0.10.0"

[dev-dependencies]
approx.workspace = true
