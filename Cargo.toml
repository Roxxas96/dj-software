[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
repository = "https://github.com/Roxxas96/dj-software"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.dependencies]
cpal = "0.18"
symphonia = "0.6"
rtrb = "0.4"
assert_no_alloc = "1.1"
clap = { version = "4.6", features = ["derive"] }
anyhow = "1"
ctrlc = "3.5.2"
thiserror = "2"
approx = "0.5"
midir = "0.11.1"
