[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
repository = "https://github.com/Roxxas96/open-jockey"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.dependencies]
cpal = "0.18"
symphonia = "0.6"
rtrb = "0.4"
assert_no_alloc = "1.1"
clap = { version = "4.6", features = ["derive"] }
anyhow = "1"
ctrlc = { version = "3.5.2", features = ["termination"] }
thiserror = "2"
approx = "0.5"
midir = "0.11.1"
toml = "1.1.8"
# Edits config.toml from the window, keeping its comments and layout.
toml_edit = "0.25.19"
serde = { version = "1.0.229", features = ["derive"] }
directories = "6.0.0"
rusqlite = { version = "0.41.1", features = ["bundled", "backup"] }
blake3 = "1.8.7"
dunce = "1.0.5"
lofty = "0.25.5"
# Decodes embedded cover art; only the two formats tags carry.
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
notify = "8.2.1"
walkdir = "2.5.0"
tempfile = "3.27.0"
rustfft = "6.4.1"
signalsmith-stretch = "0.1.3"
eframe = "0.37.0"
egui = "0.37.0"
egui_kittest = "0.37.0"
jiff = "0.2.40"
# Reads VirtualDJ's XML databases and playlists.
quick-xml = "0.42.0"

# Decoding a whole track before it plays (MP3, AAC, FLAC, WAV) takes seconds unoptimized,
# so loading a track in a debug build (`cargo run`) is slow: a 4-minute 320 kbps MP3 took
# 4.6 s unoptimized and 0.25 s with these.
[profile.dev.package.decode]
opt-level = 3
[profile.dev.package.symphonia-core]
opt-level = 3
[profile.dev.package.symphonia-common]
opt-level = 3
[profile.dev.package.symphonia-bundle-mp3]
opt-level = 3
[profile.dev.package.symphonia-bundle-flac]
opt-level = 3
[profile.dev.package.symphonia-codec-aac]
opt-level = 3
[profile.dev.package.symphonia-codec-pcm]
opt-level = 3
[profile.dev.package.symphonia-format-isomp4]
opt-level = 3
[profile.dev.package.symphonia-format-riff]
opt-level = 3

# The keylock stretcher is C++ built by the crate's build script; unoptimized it costs
# about a millisecond per deck and block, too slow for debug builds and tests.
[profile.dev.package.signalsmith-stretch]
opt-level = 3

# The stems cache's Vorbis encoder (C, built by the crate's build script) and decoder are
# far too slow unoptimized for the cache's tests.
[profile.dev.package.aotuv_lancer_vorbis_sys]
opt-level = 3
[profile.dev.package.symphonia-codec-vorbis]
opt-level = 3
